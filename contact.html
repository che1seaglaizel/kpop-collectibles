<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SEAHÉ⭑.ᐟ | Contact</title>
    <link rel="stylesheet" href="style.css">
</head>
<style>
main {
    max-width: 1000px;
    margin: 0 auto;
    padding: 45px 30px 60px;
}

/* CONTACT US TITLE */
main > h2 {
    text-align: center;
    font-size: 36px;
    margin: 0 0 45px;
    color: #222;
}

main > h2::after {
    content: "";
    display: block;
    width: 55px;
    height: 5px;
    background-color: #789b91;
    margin: 12px auto 0;
    border-radius: 5px;
}

/* LEFT + RIGHT LAYOUT */
.contact-container {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 35px;
    align-items: stretch;
}

/* CONTACT CARD */
.contact {
    background-color: rgba(220, 230, 226, 0.95);
    border-radius: 15px;
    padding: 40px 35px;
    text-align: left;
    box-shadow: 0 5px 15px rgba(0, 0, 0, 0.12);
}

.contact h3 {
    font-size: 30px;
    margin: 0 0 10px;
}

.contact h3::after {
    content: "";
    display: block;
    width: 45px;
    height: 5px;
    background-color: #789b91;
    margin-top: 10px;
    border-radius: 5px;
}

.contact p {
    margin: 25px 0;
    line-height: 1.6;
}

.contact ul {
    list-style: none;
    padding: 0;
    margin: 0;
}

.contact li {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 22px 0;
    font-size: 15px;
}

.contact a {
    color: #333;
    font-weight: bold;
    text-decoration: none;
}

.contact a:hover {
    text-decoration: underline;
}

/* FORM */
.form {
    width: 100%;
}

.form form {
    height: 100%;
}

fieldset {
    height: 100%;
    border: none;
    border-radius: 15px;
    padding: 30px 35px;
    background-image: url("download.jpg");
    background-size: cover;
    background-position: center;
    box-shadow: 0 5px 15px rgba(0, 0, 0, 0.15);
    text-align: left;
}

legend {
    background-color: white;
    padding: 8px 18px;
    border-radius: 20px;
    font-size: 18px;
    font-weight: bold;
}

/* LABELS */
label {
    display: block;
    margin: 15px 0 7px;
    font-weight: bold;
}

/* INPUTS */
input,
select,
textarea {
    width: 100%;
    padding: 12px 14px;
    border: 1px solid #aaa;
    border-radius: 8px;
    background-color: rgba(255, 255, 255, 0.9);
    font-family: Arial, sans-serif;
    font-size: 14px;
}

textarea {
    resize: vertical;
    min-height: 120px;
}

/* KEYBOARD FOCUS */
input:focus,
select:focus,
textarea:focus {
    outline: 3px solid #b7d8cf;
    border-color: #789b91;
}

/* BUTTON */
button {
    margin-top: 20px;
    padding: 12px 25px;
    border: none;
    border-radius: 8px;
    background-color: #789b91;
    color: white;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background-color: #5f8379;
}

button:focus {
    outline: 3px solid #b7d8cf;
    outline-offset: 2px;
}

/* MOBILE */
@media (max-width: 700px) {
    .contact-container {
        grid-template-columns: 1fr;
    }

    main {
        padding: 30px 15px 45px;
    }

    main > h2 {
        font-size: 30px;
    }

    .contact,
    fieldset {
        padding: 30px 25px;
    }
}
</style>
<body>

    <header>
        <h1>SEAHÉ⭑.ᐟ</h1>
        <p>Your haven for official K-pop albums and photocards!</p>

        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>
 <main>
    <h2>Contact Us</h2>

    <div class="contact-container">

        <!-- Contact Information -->
        <section class="contact">
            <h3>Get In Touch</h3>

            <p>Have questions about our albums or photocards?</p>

            <ul>
                <li>
                    📍 <span>SEAHÉ K-pop Shop</span>
                </li>

                <li>
                    ✉️
                    <a href="mailto:seaheshop@gmail.com">
                        seaheshop@gmail.com
                    </a>
                </li>

                <li>
                    📞
                    <a href="tel:+63933428791">
                        +63 934 287 91
                    </a>
                </li>
            </ul>
        </section>

        <!-- Contact Form -->
        <section class="form">
            <form>
                <fieldset>
                    <legend>Your details</legend>

                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" required>

                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required>

                    <label for="subject">Subject</label>
                    <select id="subject" name="subject">
                        <option value="product-question">Product question</option>
                        <option value="order-status">Order status</option>
                        <option value="wholesale">Wholesale enquiry</option>
                        <option value="other">Something else</option>
                    </select>

                    <label for="message">Message</label>
                    <textarea id="message" name="message" rows="5" required></textarea>

                    <button type="submit">Send message</button>
                </fieldset>
            </form>
        </section>

    </div>

</main>

    <footer>
        <p>&copy; 2026 SEAHÉ⭑.ᐟ. All rights reserved.</p>
    </footer>

</body>
</html>
