<!DOCTYPE html>
<html lang="en">
<head>

<style>
    body {
    background-color: rgba(230, 230, 230, 0.5);
    font-family: Arial, sans-serif;
    text-align: center;
    margin: 0;
}

header {
    background-image: url("leobg.jpg");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    padding: 60px 20px;
}

nav ul {
    list-style: none;
    padding: 0;
}

nav li {
    display: inline;
    margin: 0 15px;
}

nav a {
    text-decoration: none;
    color: black;
    font-weight: bold;
}

main {
    display: flex;
    justify-content: center;
    padding: 40px 20px;
}

.owner {
    background-color: rgba(220, 230, 226, 0.9);
    padding: 30px;
    width: 70%;
    max-width: 700px;
    border-radius: 15px;
}

footer {
    background-color: rgba(230, 230, 230, 0.5);
    padding: 10px;
}
form {
    background-image: url("form.jpg");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    padding: 100px 100px;
}


    </style>
<body>

    <header>
        <h1>SEAHÉ⭑.ᐟ</h1>
        <p>Your haven for official K-pop albums and photocards!</p>

        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="contact">
            <h2>Contact Us</h2>
            <p>Have questions about our albums or photocards? You can reach us through:</p>

            <ul>
                <li>
                    Email:
                    <a href="mailto:seaheshop@gmail.com">
                        seaheshop@gmail.com
                    </a>
                </li>
                <li>
                    Contact no.
                    <a  href="tel:+63933428791">
                        +63 9342 8791
                    </a>
                </li>
            </ul>
        </section>
<section class="form">
 <fieldset>
    <legend>Your details</legend>

    <label for="name">Name</label>
    <input type="text" id="name" name="name" required>

    <label for="email">Email</label>
    <input type="email" id="email" name="email" required>

    <label for="subject">Subject</label>
    <select id="subject" name="subject">
        <option value="product-question">Product question</option>
        <option value="order-status">Order status</option>
        <option value="wholesale">Wholesale enquiry</option>
        <option value="other">Something else</option>
    </select>

    <label for="message">Message</label>
    <textarea id="message" name="message" rows="6" required></textarea>

    <button type="submit">Send message</button>
 </fieldset>
</section>
    </main>

    <footer>
